# Pin a tree containing PHP 8.4.27 (NixOS/nixpkgs PR #576853) and Node 24.
# Replacing the package list also removes the provider's Node 18 / npm-9_x.
[phases.setup]
nixpkgsArchive = 'ac21430f558e5714364c7e4757b8b680815bb538'
nixPkgs = ['php84', 'php84Packages.composer', 'nginx', 'libmysqlclient', 'nodejs_24']
nixOverlays = []

[phases.install]
# Do not inherit the PHP provider's --ignore-platform-reqs install command.
cmds = ['mkdir -p /var/log/nginx /var/cache/nginx', 'composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader', 'npm ci --include=dev']

# Keep the provider's asset build. Never migrate at build time.
[phases.build]
cmds = ['composer check-platform-reqs --no-dev', '...']

[start]
# Match the Nixpacks PHP provider's prestart + PHP-FPM/Nginx command, with
# Laravel preparation after prestart permissions and before either server.
cmd = "node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && sh scripts/start-container.sh sh -c 'php-fpm -y /assets/php-fpm.conf & exec nginx -c /nginx.conf'"
